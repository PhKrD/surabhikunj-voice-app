// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
        classpath 'com.google.gms:google-services:4.4.4'
        // Required by the Device Policy Controller module (com.surabhikunj.voice.dpc) —
        // ported from the former standalone "VOICE Kids" child app so parental-control
        // device-owner enforcement lives inside this single app. See app/build.gradle.
        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:2.1.21'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
