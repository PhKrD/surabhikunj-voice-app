<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#6845e0" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="VOICE" />
    <title>VOICE</title>
    <style>
      html, body { margin: 0; background: #f7f6fb; }
      @media (prefers-color-scheme: dark) { html, body { background: #14121c; } }
      .boot-splash { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; font-family: Inter, system-ui, sans-serif; }
      .boot-splash__logo { width: 64px; height: 64px; border-radius: 20px; background: #6845e0; display: flex; align-items: center; justify-content: center; box-shadow: 0 12px 32px -12px rgba(104, 69, 224, 0.6); animation: boot-pulse 1.6s ease-in-out infinite; }
      .boot-splash__name { font-weight: 800; letter-spacing: 0.2em; font-size: 14px; color: #6845e0; }
      @keyframes boot-pulse { 50% { transform: scale(0.94); opacity: 0.85; } }
      @media (prefers-reduced-motion: reduce) { .boot-splash__logo { animation: none; } }
    </style>
  </head>
  <body>
    <div id="root">
      <!-- Splash: visible instantly, before any JavaScript loads, then
           replaced when React renders. Matches the native splash colour. -->
      <div class="boot-splash" aria-label="Loading VOICE">
        <div class="boot-splash__logo">
          <svg viewBox="0 0 24 24" width="34" height="34" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/></svg>
        </div>
        <div class="boot-splash__name">VOICE</div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
